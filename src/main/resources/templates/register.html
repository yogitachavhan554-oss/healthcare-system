<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Healthcare System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #20c997);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            font-family: 'Segoe UI', sans-serif;
        }
        .register-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .logo { text-align: center; font-size: 28px; font-weight: bold; color: #0d6efd; margin-bottom: 20px; }
        .btn-register { width: 100%; height: 45px; font-weight: bold; }
    </style>
</head>
<body>

<div class="register-card">
    <div class="logo">❤️ Healthcare System</div>
    <h3 class="text-center mb-4">Create Account</h3>

    <form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label class="form-label"> Name</label>
            <input type="text" class="form-control" name="name" placeholder="Enter your full name" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" name="email" placeholder="name@example.com" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mobile Number</label>
            <input type="tel" class="form-control" name="mobile" placeholder="Enter 10-digit number" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" placeholder="Create a password" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" name="confirmPassword" placeholder="Re-enter your password" required>
        </div>

        <button type="submit" class="btn btn-success btn-register">Register</button>
    </form>

    <div class="text-center mt-3">
        Already have an account? <a href="/login" class="text-decoration-none">Login</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
