<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; margin: 0; }
        #sidebar { width: 250px; background: #0d6efd; color: white; padding: 20px; flex-shrink: 0; }
        #content { flex-grow: 1; padding: 40px; background: #f4f6f9; }
        .nav-link { color: white; margin-bottom: 10px; display: block; text-decoration: none; padding: 10px; }
        .nav-link:hover { background: rgba(255,255,255,0.2); }
        .card { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 25px; }
    </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
    <h4>Healthcare</h4>
    <hr>
    <a href="/dashboard" class="nav-link">Dashboard</a>
    <a href="/patient-profile" class="nav-link">Patient Profile</a> <!-- Sidebar mein shift kiya -->
    <a href="/caregivers" class="nav-link">Caregivers</a>
    <a href="/services" class="nav-link">Services</a>
    <a href="/bookings" class="nav-link">Book Service</a>
    <a href="/booking-history" class="nav-link">Booking History</a>
    <a href="/complaint" class="nav-link">Complaint</a>
    <hr>
    <a href="/logout" class="nav-link">Logout</a>
</div>

<!-- Main White Content Area -->
<div id="content">
    <h3>Welcome, <span th:text="${patient.name}">User</span>!</h3>
    <br>
    
    <div class="card">
        <h5>Recent Bookings</h5>
        <table class="table table-hover mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Service</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Session mein store kiye gaye user ka data use karein -->
                <tr th:each="b : ${bookings}">
                    <td th:text="${b.id}"></td>
                    <td th:text="${b.serviceName}"></td>
                    <td th:text="${b.status}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
