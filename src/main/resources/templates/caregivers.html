<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <h2 class="text-primary mb-4 text-center">Meet Our Verified Caregivers</h2>
        
        <div class="row g-4">
            <div class="col-md-4" th:each="c : ${caregiversList}">
                <div class="card card-custom p-4" style="border-radius: 15px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                    
                    <div class="text-center mb-3">
                        <i class="fa-solid fa-user-nurse fa-4x text-primary"></i>
                    </div>
                    
                    <h4 class="text-center" th:text="${c.name}">Amit Sharma</h4>
                    <p class="text-muted text-center" th:text="${c.qualification}">BSc Nursing</p>
                    
                    <div class="mt-3">
                        <p>
                            <strong>Rating:</strong> 
                            <span th:text="${c.averageRating != null ? #numbers.formatDecimal(c.averageRating, 1, 1) : '0.0'}">0.0</span> / 5.0
                            <i class="fa-solid fa-star" style="color: #FFD43B;"></i> </p>
                        
                        <p><strong>Experience:</strong> <span th:text="${c.experience}">5 Years</span></p>
                    </div>
                    
                    <a th:href="@{/book(caregiverId=${c.id})}" class="btn btn-primary w-100 mt-3">Book Now</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
