<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <title>Healthcare System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="sidebar">
        <div class="logo"><i class="fa-solid fa-heart-pulse me-2"></i>Healthcare</div>
        <a href="/dashboard" class="nav-link"><i class="fa-solid fa-house me-3"></i>Dashboard</a>
        <a href="/patient-profile" class="nav-link"><i class="fa-solid fa-user me-3"></i>Patient Profile</a>
        <a href="/services" class="nav-link"><i class="fa-solid fa-server me-3"></i>Services</a>
        <a href="/caregivers" class="nav-link"><i class="fa-solid fa-user-nurse me-3"></i>Caregivers</a>
        <a href="/book" class="nav-link"><i class="fa-solid fa-bookmark me-3"></i>Book Service</a>
        <a href="/booking-history" class="nav-link"><i class="fa-solid fa-clock-rotate-left me-3"></i>Booking History</a>
        
        <a href="/complaint" class="nav-link"><i class="fa-solid fa-circle-exclamation me-3"></i>Complaint</a>
        
        <a href="/logout" class="nav-link mt-5 text-warning"><i class="fa-solid fa-right-from-bracket me-3"></i>Logout</a>
    </div>

    <div id="main-content">
        <div th:replace="${content}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
