<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <h1 class="text-center mb-5 text-primary fw-bold">Healthcare Services</h1>

        <div class="row g-4">
            <div class="col-md-6 col-lg-3" th:each="s : ${servicesList}">
                <div class="card card-custom p-3 service-card" style="border-radius: 15px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                    <div class="card-body text-center">
                        <i class="fa-solid fa-user-nurse" style="font-size:55px; color:#0d6efd;"></i>
                        
                        <h4 class="mt-3" th:text="${s.name}">Service Name</h4>
                        <p th:text="${s.description}">Service Description</p>
                        
                
                        
                        <a th:href="@{/book(serviceId=${s.id})}" class="btn btn-primary w-100">Book Now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
