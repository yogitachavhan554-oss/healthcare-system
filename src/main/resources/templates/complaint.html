<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-custom p-4" style="border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                    <h3 class="mb-4 text-primary">Submit a Complaint</h3>
                    
                    <div th:if="${param.success}" class="alert alert-success">Complaint submitted successfully!</div>
                    
                    <form th:action="@{/submit-complaint}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" name="subject" class="form-control" placeholder="Brief subject" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="5" placeholder="Describe your issue in detail" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Submit Complaint</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
