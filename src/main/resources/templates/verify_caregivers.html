<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <h3 class="mt-3">Pending Caregiver Verifications</h3>
        
        <div th:if="${message}" class="alert alert-success mt-3" th:text="${message}"></div>

        <table class="table table-hover mt-4">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Qualification</th>
                    <th>Experience</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${caregiversList}">
                    <td th:text="${c.name}"></td>
                    <td th:text="${c.qualification}"></td>
                    <td th:text="${c.experience}"></td>
                    <td>
                        <span th:text="${c.status != null ? c.status : 'Pending'}" 
                              th:classappend="${c.status == 'Approved' ? 'badge bg-success' : (c.status == 'Rejected' ? 'badge bg-danger' : 'badge bg-warning text-dark')}">
                        </span>
                    </td>
                    <td>
                        <div th:if="${c.status == 'Pending' or c.status == null}">
                            <a th:href="@{'/admin/approve/' + ${c.id}}" class="btn btn-sm btn-success">Approve</a>
                            <a th:href="@{'/admin/reject/' + ${c.id}}" class="btn btn-sm btn-danger">Reject</a>
                        </div>
                        <span th:unless="${c.status == 'Pending' or c.status == null}" class="text-muted">No Action Required</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
